name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  label:
    name: Label pull request
    uses: watanabe-1/github-actions-common/.github/workflows/pr-labeler.yml@c24a1f966b3d2d20ca30379e5a27ed137bfe760f # v1.0.2
    permissions:
      contents: read
      pull-requests: write
    with:
      configuration-path: .github/labeler.yml
