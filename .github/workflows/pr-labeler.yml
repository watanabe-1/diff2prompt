name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  label:
    name: Label pull request
    uses: watanabe-1/github-actions-common/.github/workflows/pr-labeler.yml@15224360f072051b948762dee6dc85bad60a17f2 # v1.2.6
    permissions:
      contents: read
      pull-requests: write
    with:
      configuration-path: .github/labeler.yml
