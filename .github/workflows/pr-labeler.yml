name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  label:
    name: Label pull request
    uses: watanabe-1/github-actions-common/.github/workflows/pr-labeler.yml@25793bf94b62c4948ce9742c8da78de3865822c9 # v1.1.0
    permissions:
      contents: read
      pull-requests: write
    with:
      configuration-path: .github/labeler.yml
