name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  label:
    name: Label pull request
    uses: watanabe-1/github-actions-common/.github/workflows/pr-labeler.yml@202f337fb19a680cf6ec2180192ec43460a4bd18 # v1.2.1
    permissions:
      contents: read
      pull-requests: write
    with:
      configuration-path: .github/labeler.yml
