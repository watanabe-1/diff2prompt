name: Renovate auto approve

on:
  # pull_request_target is required so the workflow can approve trusted Renovate PRs.
  # The called workflow gates on bot login/type, same repository head/base, default branch, branch prefix, label, and non-draft state.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled

permissions: {}

jobs:
  approve:
    name: Auto approve Renovate PR
    uses: watanabe-1/github-actions-common/.github/workflows/renovate-auto-approve.yml@25793bf94b62c4948ce9742c8da78de3865822c9 # v1.1.0
    permissions:
      pull-requests: write # required to submit PR approval review
    with:
      renovate-bot-login: watanabe-1-renovate-bot[bot]
      automerge-label: renovate-automerge
      head-ref-prefix: renovate/
