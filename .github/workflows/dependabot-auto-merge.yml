name: Dependabot auto merge

on:
  # pull_request_target is required so the workflow can approve and enable auto-merge for trusted Dependabot PRs.
  # The called workflow gates on Dependabot bot identity, same repository head/base, default branch, and non-draft state.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  auto-merge:
    name: Auto approve and enable auto-merge
    uses: watanabe-1/github-actions-common/.github/workflows/dependabot-auto-merge.yml@c24a1f966b3d2d20ca30379e5a27ed137bfe760f # v1.0.2
    permissions:
      contents: write # required to enable GitHub auto-merge
      pull-requests: write # required to read Dependabot metadata and submit approval review
    with:
      automerge-patch: true
      automerge-minor: true
