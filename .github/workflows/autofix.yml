name: autofix.ci # needed to securely identify the workflow

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Autofix
    uses: watanabe-1/github-actions-common/.github/workflows/autofix.yml@202f337fb19a680cf6ec2180192ec43460a4bd18 # v1.2.1
    permissions:
      contents: write # needed for autofix-ci/action to push fixes
      pull-requests: write # needed for autofix-ci/action to update the pull request
    with:
      fix-command: bun run check:fix
      update-actions-lock: true
