name: autofix.ci # needed to securely identify the workflow

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Autofix
    uses: watanabe-1/github-actions-common/.github/workflows/autofix.yml@0e9b6763a2f343233b82faed14089cf328d8f4b3 # v1.2.5
    permissions:
      contents: write # needed for autofix-ci/action to push fixes
      pull-requests: write # needed for autofix-ci/action to update the pull request
    with:
      fix-command: bun run check:fix
      update-actions-lock: true
