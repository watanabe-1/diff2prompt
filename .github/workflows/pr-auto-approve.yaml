name: Auto Approve
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  approve:
    name: Auto approve owner PR
    uses: watanabe-1/github-actions-common/.github/workflows/pr-auto-approve.yml@0e9b6763a2f343233b82faed14089cf328d8f4b3 # v1.2.5
    permissions:
      pull-requests: write # required to submit PR approval review
