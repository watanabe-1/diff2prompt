name: Auto Approve
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  approve:
    name: Auto approve owner PR
    uses: watanabe-1/github-actions-common/.github/workflows/pr-auto-approve.yml@25793bf94b62c4948ce9742c8da78de3865822c9 # v1.1.0
    permissions:
      pull-requests: write # required to submit PR approval review
