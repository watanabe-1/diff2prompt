name: Auto Approve
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  approve:
    name: Auto approve owner PR
    uses: watanabe-1/github-actions-common/.github/workflows/pr-auto-approve.yml@202f337fb19a680cf6ec2180192ec43460a4bd18 # v1.2.1
    permissions:
      pull-requests: write # required to submit PR approval review
