name: GHA static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gha-static-check:
    name: GHA static checks status check
    uses: watanabe-1/github-actions-common/.github/workflows/gha-static-check.yml@2e68dafee94b4c5c567ecf580afe89ae6a36e660 # v1.0.1
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: read
    with:
      actionlint-self-action-path: "$/.github/actions/setup-toolchain"
      actionlint-self-reusable-workflow-path: "$/.github/workflows/add-version-to-pr-title.yml"
