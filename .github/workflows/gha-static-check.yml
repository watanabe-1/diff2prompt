name: GHA static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  gha-static-check:
    name: GHA static checks status check
    uses: watanabe-1/github-actions-common/.github/workflows/gha-static-check.yml@202f337fb19a680cf6ec2180192ec43460a4bd18 # v1.2.1
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: read
    with:
      actionlint-self-reusable-workflow-path: "$/.github/workflows/add-version-to-pr-title.yml"
