name: GHA static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  gha-static-check:
    name: GHA static checks status check
    uses: watanabe-1/github-actions-common/.github/workflows/gha-static-check.yml@0e9b6763a2f343233b82faed14089cf328d8f4b3 # v1.2.5
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: read
    with:
      actionlint-self-reusable-workflow-path: "$/.github/workflows/add-version-to-pr-title.yml"
