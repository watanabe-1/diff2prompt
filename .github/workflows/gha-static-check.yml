name: GHA static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  gha-static-check:
    name: GHA static checks status check
    uses: watanabe-1/github-actions-common/.github/workflows/gha-static-check.yml@25793bf94b62c4948ce9742c8da78de3865822c9 # v1.1.0
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: read
    with:
      actionlint-self-reusable-workflow-path: "$/.github/workflows/add-version-to-pr-title.yml"
