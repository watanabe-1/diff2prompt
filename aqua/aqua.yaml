# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/aqua-yaml.json

# aqua - Declarative CLI Version Manager

# https://aquaproj.github.io/

checksum:
  enabled: true
  require_checksum: true
  supported_envs:
    - all
registries:
  - type: standard
    ref: v4.581.1 # renovate: depName=aquaproj/aqua-registry

packages:
  - name: nodejs/node@v26.13.0
  - name: oven-sh/bun@bun-v1.4.4
  - name: rhysd/actionlint@v1.7.12
  - name: reviewdog/reviewdog@v0.21.2
  - name: suzuki-shunsuke/ghalint@v1.6.0
  - name: zizmorcore/zizmor@v1.32.0
  - name: suzuki-shunsuke/pinact@v5.0.2
